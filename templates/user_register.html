
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAFFIX | User Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #07142b;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #10284e;
            border: 1px solid #164b72;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 150, 255, 0.15);
        }

        h1 {
            color: #00d9ff;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b5c9df;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #315477;
            border-radius: 8px;
            background: #071a35;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #00d9ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00c8ef;
            color: #07142b;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #65eaff;
        }

        .message {
            color: #ffaaaa;
            text-align: center;
            margin-bottom: 15px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00d9ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <h1>TRAFFIX</h1>
        <p class="subtitle">Create Your Account</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label for="username">Full Name</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password"
                   minlength="8" required>

            <button type="submit">Create Account</button>

        </form>

        <a href="/user/login">Already have an account? Login</a>

        <a href="/">← Back to Homepage</a>

    </div>

</body>
</html>
